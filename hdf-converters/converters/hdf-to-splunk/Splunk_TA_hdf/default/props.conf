## Splunk_TA_hdf — sourcetype config for HDF (Heimdall Data Format) results.
##
## The hdf-to-splunk exporter emits HEC events whose payload fields are already
## named per the CIM Vulnerabilities model (signature, signature_id, cve, cvss,
## severity, dest, vendor_product, category), so no field aliasing is required —
## search-time JSON KV extraction surfaces them directly. Event time comes from
## the HEC envelope `time`, so no TIME_FORMAT is needed here.

[hdf:results]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Security
description = HDF (Heimdall Data Format) assessment result
