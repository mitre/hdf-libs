## Events worth treating as findings for the CIM Vulnerabilities data model:
## failed/errored compliance controls and any CVE finding. Passed, notApplicable
## and notReviewed non-CVE controls are intentionally excluded — they remain
## queryable under sourcetype=hdf:results for posture reporting, but are not
## "vulnerabilities". hdf_status carries the RAW (pre-override) verdict, so a
## waived failure is still hdf_status=failed; the separate suppressed field
## marks raw-failing-but-accepted findings (waiver/falsePositive/attestation).
## Excluding suppressed=true keeps accepted risk out of the active findings model,
## while a risk-adjusted still-failing control (suppressed=false) stays in.

[hdf_finding]
search = sourcetype=hdf:results (hdf_status=failed OR hdf_status=error OR cve=*) NOT suppressed=true
