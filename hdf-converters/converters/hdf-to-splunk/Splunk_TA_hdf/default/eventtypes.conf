## Events worth treating as findings for the CIM Vulnerabilities data model:
## failed/errored compliance controls and any CVE finding. Passed, notApplicable
## and notReviewed non-CVE controls are intentionally excluded — they remain
## queryable under sourcetype=hdf:results for posture reporting, but are not
## "vulnerabilities". hdf_status carries the effective (post-override) verdict,
## so a waived control (hdf_status=passed) is correctly not tagged.

[hdf_finding]
search = sourcetype=hdf:results (hdf_status=failed OR hdf_status=error OR cve=*)
