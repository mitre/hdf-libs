packages:
  - 'hdf-*'
  - 'site'
allowBuilds:
  # Analytics-on-install from a Redocly CLI transitive dep. Never runs: a lint
  # tool must not phone home from a dev install.
  '@scarf/scarf': false
  esbuild: true
# Supply-chain cooldown: refuse dependency versions published within the last
# 7 days (10080 min) AT RESOLUTION TIME, so a freshly-published compromised
# version (the npm credential-harvester worm pattern) has time to be detected
# and scrubbed before we can pull it. pnpm 11 already defaults this to 1440
# (24h); we extend to a week. Frozen-lockfile installs (CI) are UNAFFECTED —
# they use locked versions and never re-resolve. To take a genuinely-needed
# fresh patch, add the package to minimumReleaseAgeExclude — a conscious,
# reviewed opt-out (bare name, an @org/* pattern, or pkg@x.y.z).
minimumReleaseAge: 10080
# GHSA-68fv-2mgg-jv7q's only patched source-map-js (1.2.2) is younger than the
# cooldown, and it is the whole 1.x line's fix, so the choice is this opt-out or
# a known-vulnerable dev tree. Pinned to the exact version so a later release
# serves its cooldown normally; goes when 1.2.2 ages past the window.
minimumReleaseAgeExclude:
  - source-map-js@1.2.2
# Forced patched versions for transitive advisories (see the security gate).
# Every target is a RANGE, never an exact version: an exact pin names the floor
# itself, so when the advisory's patched floor rises the pin becomes the new
# vulnerable version, and because the pre-commit hook runs the audit that blocks
# every commit in the repo at once (fast-uri pinned to 3.1.6, brace-expansion to
# 5.0.9). A range does not move on its own — pnpm reuses the lockfile's
# resolution — but the remedy becomes `pnpm update` instead of an edit here.
# Each entry says what it holds back and what would let it go. An entry that
# protects nothing is REMOVED, not bumped, and the test for that is whether
# removing it introduces an advisory, not whether its range still matches
# something: a selector can be broader than the advisory it was written for.
# scripts/check-override-freshness.mjs enforces the range and comment rules.
# Full procedure: site/docs/contributing/developer-guide.md → Dependency Audit Overrides.
overrides:
  # ajv 8.17.1 via @stryker-mutator/core (dev); goes when stryker declares ^8.18.0.
  "ajv@>=8.0.0 <8.18.0": "^8.18.0"
  # esbuild 0.21.5 via vite 5.4.x under vitepress 1.x; goes with the vitepress
  # 2.x bump that also clears the vite suppressions below.
  "esbuild@<0.25.0": "^0.25.0"
  # minimatch 10.1.3 via @stryker-mutator/core (dev); goes when stryker declares ^10.2.3.
  "minimatch@>=10.0.0 <10.2.3": "^10.2.3"
  # shell-quote 1.8.3 via concurrently (dev); goes when concurrently declares ^1.8.5.
  "shell-quote@<1.8.5": "^1.10.0"
  # GHSA-w5hq-g745-h8pq — uuid 9.0.1 buffer bounds, via @hyperjump/json-schema
  # (dev); goes when that package declares ^11.
  "uuid@<11.1.1": "^11.1.1"
  # GHSA-68fv-2mgg-jv7q — source-map-js 1.2.1 event-loop DoS, reached through 86
  # paths (vite/postcss, vitest, vue's compiler) and all dev; goes when those
  # declare ^1.2.2 themselves.
  "source-map-js@<1.2.2": "^1.2.2"
  # GHSA-g2v6-rqmx-r4w6 — @vue/server-renderer 3.5.31, carried by vue under
  # vitepress 1.x (dev). Overriding vue rather than the renderer keeps the @vue/*
  # family on one version; goes with the vitepress 2.x bump.
  "vue@<3.5.42": "^3.5.43"
  # GHSA-4x5r-pxfx-6jf8 — @babel/core 7.28.6 sourceMappingURL read, reached
  # through babel's own plugin chain under stryker (dev). The advisory floor is
  # 7.29.1 but that release was skipped, so 7.29.7 is the real 7.x fix; goes when
  # stryker's babel plugins declare ^7.29.7 themselves.
  "@babel/core@<7.29.1": "^7.29.7"
auditConfig:
  ignoreGhsas:
    # GHSA-fx2h-pf6j-xcff — vite (transitive under vitepress 1.x); clears when
    # vitepress moves to 2.x (tracked: hdf-libs-34nl).
    - "GHSA-fx2h-pf6j-xcff"
    # GHSA-4w7w-66w2-5vf9 / GHSA-v6wh-96g9-6wx3 — vite 5.4.x (same vitepress-1.x
    # transitive chain; no patched 5.x exists, fixes are 6.4.2+/6.4.3+); clears
    # with the same vitepress 2.x bump (tracked: hdf-libs-34nl).
    - "GHSA-4w7w-66w2-5vf9"
    - "GHSA-v6wh-96g9-6wx3"
