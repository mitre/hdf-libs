packages:
  - 'hdf-*'
  - 'site'
allowBuilds:
  esbuild: true
# Supply-chain cooldown: refuse dependency versions published within the last
# 7 days (10080 min) AT RESOLUTION TIME, so a freshly-published compromised
# version (the npm credential-harvester worm pattern) has time to be detected
# and scrubbed before we can pull it. pnpm 11 already defaults this to 1440
# (24h); we extend to a week. Frozen-lockfile installs (CI) are UNAFFECTED —
# they use locked versions and never re-resolve. To take a genuinely-needed
# fresh patch, add the package to minimumReleaseAgeExclude — a conscious,
# reviewed opt-out (bare name, an @org/* pattern, or pkg@x.y.z).
minimumReleaseAge: 10080
# Forced patched versions for transitive advisories (see the security gate).
# These GO STALE: when an advisory's patched floor rises, the version pinned here
# becomes the new vulnerable floor and the gate fails on the next unrelated commit.
# Re-validate on each dependabot cycle — do NOT just react when a commit trips it.
# Full procedure: site/docs/contributing/developer-guide.md → Dependency Audit Overrides.
overrides:
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "minimatch@>=10.0.0 <10.2.3": "10.2.3"
  "rollup@>=4.0.0 <4.59.0": "4.59.0"
  "esbuild@<0.25.0": "0.25.0"
  "shell-quote@<1.8.5": "1.10.0"
  "underscore@<1.13.8": "1.13.8"
  "lodash@>=4.0.0 <4.18.0": "4.18.1"
  "ajv@>=6.0.0 <6.14.0": "6.14.0"
  "ajv@>=8.0.0 <8.18.0": "8.18.0"
  "qs@<6.15.2": "6.15.2"
  "flatted@<3.4.2": "3.4.2"
  "picomatch@<2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "yaml@>=2.0.0 <2.8.3": "2.8.3"
  "brace-expansion@<5.0.9": "5.0.9"
  "fast-uri@<3.1.5": "3.1.5"
  "fast-xml-builder@<1.1.9": "1.1.9"
  "follow-redirects@<1.16.0": "1.16.0"
  "postcss@<8.5.23": "8.5.23"
  "browserslist@<4.28.7": "4.28.7"
  "nanoid@<3.3.18": "3.3.18"
  "fflate@0.8.3": "0.8.2"
  # GHSA-w5hq-g745-h8pq — uuid buffer bounds (via @hyperjump/json-schema, dev).
  "uuid@<11.1.1": "11.1.1"
  # GHSA-4x5r-pxfx-6jf8 — @babel/core sourceMappingURL read (via stryker, dev).
  # Advisory floor is 7.29.1 but that release was skipped; 7.29.7 is the real 7.x fix.
  "@babel/core@<7.29.1": "7.29.7"
auditConfig:
  ignoreGhsas:
    # GHSA-fx2h-pf6j-xcff — vite (transitive under vitepress 1.x); clears when
    # vitepress moves to 2.x (tracked: hdf-libs-34nl).
    - "GHSA-fx2h-pf6j-xcff"
