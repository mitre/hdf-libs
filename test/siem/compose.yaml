services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537
    profiles: [elasticsearch]
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ES_PASSWORD:?generated by the SIEM runner}
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ['127.0.0.1::9200']
    mem_limit: 2g
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200 >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
  splunk:
    image: splunk/splunk:10.6.1@sha256:2a7cf9d2e8a2226773a9fac95b5e0e2cc8752496abfb134a21bdf8f67c9ee44d
    platform: linux/amd64
    profiles: [splunk]
    environment:
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:-}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:-}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?generated by the SIEM runner}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?generated by the SIEM runner}
    configs:
      - source: splunk-defaults
        target: /tmp/defaults/default.yml
    ports: ['127.0.0.1::8088', '127.0.0.1::8089']
    mem_limit: 4g
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail -u "admin:$$SPLUNK_PASSWORD" http://localhost:8089/services/server/info >/dev/null && curl --silent --fail -H "Authorization: Splunk $$SPLUNK_HEC_TOKEN" http://localhost:8088/services/collector/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 60
configs:
  splunk-defaults:
    content: |
      splunk:
        ssl:
          enable: false
        hec:
          enable: true
          ssl: false
          token: ${SPLUNK_HEC_TOKEN}
