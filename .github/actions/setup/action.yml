name: 'Setup hdf-libs'
description: 'Setup Node/pnpm with mise, install dependencies, optionally setup Go. Repo must be checked out first.'
# note -- setup will always need the TS installation; even the Go test
# suites are orchestrated by pnpm.
inputs:
  go:
    description: 'Setup Go toolchain'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Node and pnpm come from mise.toml and mise.lock (pnpm's version from
    # packageManager), the releases the pre-commit hook uses, installed
    # --locked against the lock's checksums. Only these two are installed here;
    # a configured tool that is not installed gets no PATH entry.
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.5
        install_args: node pnpm

    # The store path is read from pnpm rather than hardcoded: it differs per
    # OS, and a hardcoded path silently missed Windows.
    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # go-version-file keeps the toolchain in lockstep with go.work — a
    # separate version pin here drifted once (jobs set up one version, then
    # GOTOOLCHAIN silently re-downloaded the real one per job).
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: inputs.go == 'true'
      with:
        go-version-file: go.work
        cache-dependency-path: '**/go.sum'
