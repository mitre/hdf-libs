name: 'Setup hdf-libs'
description: 'Setup Node/pnpm, install dependencies, optionally setup Go. Repo must be checked out first.'
# note -- setup will always need the TS installation; even the Go test
# suites are orchestrated by pnpm.
inputs:
  go:
    description: 'Setup Go toolchain'
    required: false
    default: 'false'
  node-version:
    description: 'Node version'
    required: false
    default: '22'

runs:
  using: composite
  steps:
    # pnpm before node so setup-node's cache: pnpm can resolve the store
    # path itself (per-OS — a hardcoded path silently missed Windows).
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # go-version-file keeps the toolchain in lockstep with go.work — a
    # separate version pin here drifted once (jobs set up one version, then
    # GOTOOLCHAIN silently re-downloaded the real one per job).
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      if: inputs.go == 'true'
      with:
        go-version-file: go.work
        cache-dependency-path: '**/go.sum'
