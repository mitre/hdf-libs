name: Setup pinned npm
description: Install the same integrity-verified npm client for CI, consumers and publishing. Node must already be installed.
runs:
  using: composite
  steps:
    - name: Install integrity-pinned npm
      shell: bash
      env:
        NPM_VERSION: '11.21.0'
        NPM_SHA512: 'Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg=='
      run: |
        # GNU tar reads the drive letter of a Windows path (D:\a\_temp) as a remote host.
        tmp="$RUNNER_TEMP"
        if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -u "$RUNNER_TEMP"); fi
        archive="$tmp/npm-cli.tgz"
        curl --fail --silent --show-error --retry 3 --max-time 120 \
          "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz" -o "$archive"
        actual=$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)
        test "$actual" = "$NPM_SHA512"
        mkdir -p "$tmp/pinned-npm"
        tar -xzf "$archive" -C "$tmp/pinned-npm" --strip-components=1
        test "$(node "$tmp/pinned-npm/bin/npm-cli.js" --version)" = "$NPM_VERSION"
        # Keep Node's existing npm/npx launchers on both Unix and Windows.
        node_bin=$(node -p 'require("path").dirname(process.execPath).split(require("path").sep).join("/")')
        if [ "$RUNNER_OS" = Windows ]; then
          modules=$(npm root --global)
          modules=${modules//\\//}
          if [ ! -d "$modules/npm" ]; then modules="$node_bin/node_modules"; fi
        else
          modules="$node_bin/../lib/node_modules"
        fi
        test -d "$modules/npm"
        mv "$modules/npm" "$tmp/original-npm"
        mv "$tmp/pinned-npm" "$modules/npm"
        test "$(npm --version)" = "$NPM_VERSION"
        echo "Using npm $NPM_VERSION"
