# Applies to: golangci-lint, one document per Go module from go.work and per target OS
# (the Linux pass, and a GOOS=windows pass that sees windows-tagged files) — the policy
# is applied to each.
rules:
    - name: no requirement errored
      where:
          status: error
      max: 0
    - name: nothing failing is unadjudicated
      where:
          status: failed
          disposition:
              not: [waiver, attestation, poam, inherited, falsePositive, riskAdjustment, operationalRequirement]
      max: 0
