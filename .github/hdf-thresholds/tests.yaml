# Applies to: JUnit from test-ts and test-go, both matrix legs, one document per suite file.
rules:
    - name: no requirement errored
      where:
          status: error
      max: 0
    # a handful of the lint tests have genuine notReviewed status, and that should not block CI
    - name: skipped stays within budget
      where:
          status: notReviewed
      max: 7
    - name: nothing failing is unadjudicated
      where:
          status: failed
          disposition:
              not: [waiver, attestation, poam, inherited, falsePositive, riskAdjustment, operationalRequirement]
      max: 0
