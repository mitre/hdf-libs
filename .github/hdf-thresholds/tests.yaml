# Test-results policy. The test jobs remain the failure authority — a red test
# fails its own job with the stack trace inline — so the failure bounds here
# only mirror them. The skip budget is what this gate decides on its own.
#
# JUnit `skipped` maps to HDF `notReviewed`, which no test runner's exit code
# can express: a suite that quietly stops running tests is green everywhere
# else. The budget is per-document, because `hdf convert` emits one HDF per
# JUnit file and there is no merge command, so a pipeline-wide total cannot be
# stated here.
#
# MEASURE FROM CI ARTIFACTS, NOT LOCALLY. The gate sees both matrix legs, and
# the OS legs differ: a single-platform measurement understates the mark and
# sets a budget CI will fail. Measured from run 34137721588 (46 documents,
# pipeline total 22) — the first run with every leg reporting. An earlier
# measurement used a run whose windows TS leg died after 3 documents; it
# happened to give the same answer, but re-measure from a FULLY GREEN run or
# the mark can be low by however many documents were missing:
#
#   go-hdf-cli        windows 11, ubuntu 4  — a large-file case, a stdin case,
#                     an HDF_BENCH=1 opt-in, one self-sizing fixture guard, and
#                     on windows seven more for the POSIX permission model and
#                     NTFS rename semantics (permission-denied read,
#                     redacted-path read failure, permission-denied write, and
#                     the four internal/atomicfile cases below)
#   ts-hdf-schema     5 on both  — one assertion removed in v2, four needing
#                     the converter layer hdf-schema cannot depend on
#   go-hdf-converters windows 1  — XCCDF schema validation
#   every other document 0
#
# 11 is therefore the per-document high-water mark, and the windows hdf-cli
# document sits exactly at it: one new skip there fails the gate.
#
# The windows figure moved 7 → 11 by SOURCE COUNT, not by the measurement
# protocol above: a gate cannot be measured from the run it gates, and these
# four skips are new in the same change. internal/atomicfile stages a temp file
# and renames it over the destination, and windows departs from that twice —
# NTFS carries no Unix mode bits (so requested-mode and preserved-mode assert
# nothing there) and MoveFileEx cannot replace a destination another handle
# holds open (so the repeated-reader case is a race rather than a guarantee,
# and the chmod-based failure injection does not deny the write). All four are
# covered on unix and the windows outcome is asserted deterministically by
# TestWriteFile_OpenReaderSeesOneCompleteVersion. RE-MEASURE from the first
# fully green run and correct this if the count differs.
#
# Known limit: a document now at 0 can grow to 11 unnoticed, and the pipeline
# total can drift while no single document crosses the line.
skipped:
    total:
        max: 11
failed:
    total:
        max: 0
error:
    total:
        max: 0
