# Applies to: the semgrep OSS security rulesets over TS and Go (one document, converted via --from semgrep).

rules:
    - name: no requirement errored
      where:
          status: error
      max: 0
    # the two notReviewed are semgrep's own partial-parse errors; a new one is a finding, so the budget is exact
    - name: skipped stays within budget
      where:
          status: notReviewed
      max: 2
    - name: nothing failing is unadjudicated
      where:
          status: failed
          disposition:
              not: [waiver, attestation, poam, inherited, falsePositive, riskAdjustment, operationalRequirement]
      max: 0
