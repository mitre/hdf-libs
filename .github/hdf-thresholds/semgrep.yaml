# Applies to: the semgrep OSS security rulesets over TS and Go (one document, converted via --from semgrep).

rules:
    - name: no requirement errored
      where:
          status: error
      max: 0
    # the one notReviewed is semgrep-scan-errors, which aggregates every file semgrep could not parse into one requirement
    - name: skipped stays within budget
      where:
          status: notReviewed
      max: 1
    - name: nothing failing is unadjudicated
      where:
          status: failed
          disposition:
              not: [waiver, attestation, poam, inherited, falsePositive, operationalRequirement]
      max: 0
