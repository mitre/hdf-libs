name: Fuzz

# Scheduled native Go fuzzing of the parser entry points (the codebase is
# largely parsers of untrusted scanner output). Per-PR CI runs each target's
# seed corpus as plain tests; this workflow does the actual coverage-guided
# mutation on a weekly budget. A found crasher is written to the package's
# testdata/fuzz/ directory and uploaded as an artifact.

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions: {}

env:
  GO_VERSION: '1.26.6'

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: hdf-utilities/go
            target: FuzzExtractXMLRootElement
          - dir: hdf-utilities/go
            target: FuzzParseCpe
          - dir: hdf-utilities/go
            target: FuzzParseCvssVector
          - dir: hdf-utilities/go
            target: FuzzParsePurl
          - dir: hdf-utilities/go
            target: FuzzParseTimestamp
          - dir: hdf-utilities/go
            target: FuzzSafePath
          - dir: hdf-converters/shared/go
            target: FuzzValidateXMLInput
          - dir: hdf-converters/converters/nessus-to-hdf/go
            target: FuzzConvertNessusToHDF
          - dir: hdf-converters/converters/burpsuite-to-hdf/go
            target: FuzzConvertBurpsuiteToHDF
          - dir: hdf-converters/converters/xccdf-results-to-hdf/go
            target: FuzzConvertXccdfToHDF
          - dir: hdf-converters/converters/ckl-to-hdf/go
            target: FuzzConvertCKLToHDF
          - dir: hdf-converters/converters/cklb-to-hdf/go
            target: FuzzConvertCKLBToHDF
          - dir: hdf-converters/converters/dbprotect-to-hdf/go
            target: FuzzConvertDbprotectToHDF
          - dir: hdf-converters/converters/junit-to-hdf/go
            target: FuzzConvertJUnitToHDF
          - dir: hdf-converters/converters/netsparker-to-hdf/go
            target: FuzzConvertNetsparkerToHDF
          - dir: hdf-converters/converters/veracode-to-hdf/go
            target: FuzzConvertVeracodeToHDF
          - dir: hdf-converters/converters/sarif-to-hdf/go
            target: FuzzConvertSarifToHDF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'

      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
        run: |
          # Captured to a file rather than piped: a pipeline's status is tee's,
          # which would mask a real failure.
          before=$(find testdata/fuzz -type f 2>/dev/null | sort)
          status=0
          go test -fuzz="^${{ matrix.target }}$" -fuzztime=300s -run='^$' . > fuzz.log 2>&1 || status=$?
          cat fuzz.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # A crasher can reach the corpus WITHOUT the "Failing input written to"
          # line: internal/fuzz's rescue defer writes the entry but only upgrades
          # the error to crashError when the run's error is nil (go1.26
          # internal/fuzz/fuzz.go), so an escaped deadline error hides the
          # finding. Assert on the corpus itself, not on log wording.
          if [ "$(find testdata/fuzz -type f 2>/dev/null | sort)" != "$before" ]; then
            echo "::error::${{ matrix.target }} wrote a new failing input to testdata/fuzz"
            exit 1
          fi
          # Go can report the -fuzztime deadline itself as a failure when workers
          # are mid-operation (golang/go#70431, #72088) — most likely on the
          # highest-throughput targets. Benign now that the corpus is unchanged.
          if grep -q "context deadline exceeded" fuzz.log && ! grep -q "Failing input written to" fuzz.log; then
            echo "::notice::${{ matrix.target }} reached the fuzztime deadline with no failing input"
            exit 0
          fi
          exit 1

      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}
          path: ${{ matrix.dir }}/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
