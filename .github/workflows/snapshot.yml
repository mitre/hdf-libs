name: Main snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Keep the running publication; newer pushes replace the one pending run.
concurrency:
  group: main-snapshot-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.repository == 'mitre/hdf-libs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source: ${{ steps.prepare.outputs.source }}
      prepared: ${{ steps.prepare.outputs.prepared }}
      version: ${{ steps.prepare.outputs.version }}
      attempt: ${{ github.run_attempt }}
      artifact: ${{ steps.metadata.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - name: Prepare snapshot
        id: prepare
        run: |
          [[ "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*\.[1-9][0-9]*$ ]]
          source=$(git rev-parse HEAD)
          stable=$(git tag --merged HEAD --sort=-version:refname --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')
          test -n "$stable" || { echo 'No reachable stable release' >&2; exit 1; }
          IFS=. read -r major minor patch <<< "${stable#v}"
          if git diff --quiet "$stable" HEAD -- hdf-schema/src/schemas; then
            base="$major.$minor.$((patch + 1))"
          else
            base="$major.$((minor + 1)).0"
          fi
          VERSION="$base-next.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          artifact="$RUNNER_TEMP/snapshot"
          mkdir -p "$artifact"
          manifests=()
          for manifest in hdf-*/package.json; do
            if jq -e '.private != true and (.name | startswith("@mitre/hdf-"))' "$manifest" >/dev/null; then
              jq --arg version "$VERSION" '
                .version = $version |
                reduce ["dependencies", "peerDependencies", "optionalDependencies"][] as $field (.;
                  if .[$field] then .[$field] |= with_entries(
                    if .key | startswith("@mitre/hdf-") then .value = $version else . end
                  ) else . end)
              ' "$manifest" > "$artifact/package.json"
              mv "$artifact/package.json" "$manifest"
              manifests+=("$manifest")
              dirname "$manifest" >> "$artifact/packages.txt"
            fi
          done
          test "${#manifests[@]}" -gt 0
          bash scripts/set-go-module-versions.sh "v$VERSION"
          git ls-files '**/go.mod' > "$artifact/gomods.txt"
          test -s "$artifact/gomods.txt"
          gomods=()
          while read -r gomod; do gomods+=("$gomod"); done < "$artifact/gomods.txt"
          git status --short
          git add -- "${manifests[@]}" "${gomods[@]}"
          prepared=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$(git write-tree)" -p "$source" -m "chore(snapshot): prepare $VERSION" -m "Snapshot-Source: $source")
          git checkout --detach "$prepared"
          git update-ref refs/heads/snapshot "$prepared"
          git bundle create "$artifact/source.bundle" refs/heads/snapshot "^$source"
          jq -n --arg source "$source" --arg prepared "$prepared" --arg version "$VERSION" \
            '{source: $source, prepared: $prepared, version: $version}' > "$artifact/snapshot.json"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "prepared=$prepared" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: metadata
        with:
          name: snapshot-metadata-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.packages.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PREPARED: ${{ needs.prepare.outputs.prepared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: $/.github/actions/setup-npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript
        run: pnpm build:ts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: snapshot-metadata
      - name: Select prepared manifests
        run: |
          git fetch snapshot-metadata/source.bundle refs/heads/snapshot
          test "$(git rev-parse FETCH_HEAD)" = "$PREPARED"
          git checkout --detach "$PREPARED"
      - name: Pack and import npm packages
        run: |
          artifact="$RUNNER_TEMP/snapshot-packages"
          mkdir -p "$artifact"
          while read -r pkg; do
            (cd "$pkg" && pnpm pack --pack-destination "$artifact")
          done < snapshot-metadata/packages.txt
          bash scripts/check-npm-consumers.sh "$artifact"
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: packages
        with:
          name: snapshot-packages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-packages/*.tgz
          if-no-files-found: error
          retention-days: 14

  tag:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: snapshot-tags
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: snapshot-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: snapshot-metadata
      - name: Check publication attempt
        env:
          BUILT_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          test "$BUILT_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" || {
            echo 'Rerun all jobs or start a new workflow; partial-job retries cannot reuse snapshot versions.' >&2
            exit 1
          }
      - name: Publish snapshot tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREPARED: ${{ needs.prepare.outputs.prepared }}
          SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.$GITHUB_RUN_ID\.$GITHUB_RUN_ATTEMPT$ ]]
          git fetch snapshot-metadata/source.bundle refs/heads/snapshot
          test "$(git rev-parse FETCH_HEAD)" = "$PREPARED"
          test "$(git show -s --format=%P "$PREPARED")" = "$SOURCE"
          refs=("refs/tags/snapshots/v$VERSION")
          while read -r gomod; do refs+=("refs/tags/${gomod%/go.mod}/v$VERSION"); done < snapshot-metadata/gomods.txt
          for ref in "${refs[@]}"; do git update-ref "$ref" "$PREPARED" 0000000000000000000000000000000000000000; done
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | openssl base64 -A)"
          git push --atomic origin "${refs[@]}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            snapshot-artifacts/*.tgz
            snapshot-metadata/*

  publish:
    needs: [prepare, build, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-snapshots
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: snapshot-artifacts
      - uses: $/.github/actions/setup-npm
      - name: Validate snapshot archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILT_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          test "$BUILT_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          number='(0|[1-9][0-9]*)'
          [[ "$VERSION" =~ ^$number\.$number\.$number-next\.$GITHUB_RUN_ID\.$GITHUB_RUN_ATTEMPT$ ]] || exit 1
          shopt -s nullglob
          packages=()
          for manifest in hdf-*/package.json; do
            jq -e '.private != true and (.name | startswith("@mitre/hdf-"))' "$manifest" >/dev/null || continue
            pkg=${manifest%/package.json}
            jq -e --arg name "@mitre/$pkg" '.name == $name' "$manifest" >/dev/null
            archive="snapshot-artifacts/mitre-$pkg-$VERSION.tgz"
            test -f "$archive" && test ! -L "$archive"
            tar -tzf "$archive" > "$RUNNER_TEMP/members.txt"
            awk '
              $0 !~ /^package(\/|$)/ || /\\/ || /\/\// || /(^|\/)\.\.?($|\/)/ { bad=1 }
              $0 == "package/package.json" { manifests++ }
              END { exit (bad || manifests != 1) }
            ' "$RUNNER_TEMP/members.txt"
            tar -tvzf "$archive" > "$RUNNER_TEMP/member-types.txt"
            awk 'substr($0,1,1) !~ /^[-d]$/ { bad=1 } END { exit bad }' "$RUNNER_TEMP/member-types.txt"
            tar -xOzf "$archive" package/package.json | jq -es --arg name "@mitre/$pkg" --arg version "$VERSION" '
              length == 1 and (.[0] |
                .name == $name and .version == $version and
                ((.publishConfig // {}) | . == {} or . == {access:"public"}) and
                ([.dependencies, .optionalDependencies, .peerDependencies] |
                  all(.[]; (. // {} | to_entries |
                    all(.[]; (.key | startswith("@mitre/hdf-") | not) or .value == $version))))
              )
            ' >/dev/null
            packages+=("$pkg")
          done
          archives=(snapshot-artifacts/*.tgz)
          test "${#packages[@]}" -gt 0 && test "${#archives[@]}" -eq "${#packages[@]}"
          printf '%s\n' "${packages[@]}" > "$RUNNER_TEMP/packages.txt"
      - name: Publish packages and advance next
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILT_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          test "$BUILT_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          # npm provenance must identify the revision actually checked out from main.
          export GITHUB_SHA="$SOURCE"
          while read -r pkg; do
            npm publish "snapshot-artifacts/mitre-$pkg-$VERSION.tgz" \
              --access public --provenance --ignore-scripts --tag snapshot-staging \
              --registry=https://registry.npmjs.org --@mitre:registry=https://registry.npmjs.org
          done < "$RUNNER_TEMP/packages.txt"
          while read -r pkg; do
            npm dist-tag add "@mitre/$pkg@$VERSION" next \
              --registry=https://registry.npmjs.org --@mitre:registry=https://registry.npmjs.org
          done < "$RUNNER_TEMP/packages.txt"
