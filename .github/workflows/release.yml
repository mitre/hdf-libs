name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.26.1'

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - uses: ./.github/actions/setup

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Update all package versions to match the tag
          pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish packages (dry run on pre-release tags)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc

          # Publish order matters: dependencies first
          PACKAGES=(
            hdf-schema
            hdf-utilities
            hdf-mappings
            hdf-validators
            hdf-parsers
            hdf-converters
            hdf-generators
            hdf-diff
            hdf-extension-graph
          )

          # Pre-release tags (v2.0.0-rc.1) publish with --tag next
          TAG_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_FLAG="--tag next"
          fi

          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing $pkg@$VERSION..."
            cd "$pkg"
            pnpm publish --no-git-checks $TAG_FLAG
            cd ..
          done

  build-cli:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
          workdir: hdf-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-binaries
          path: hdf-cli/dist/*
          retention-days: 1

  build-schemas:
    name: Build schema assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - uses: ./.github/actions/setup

      - name: Build schemas
        run: cd hdf-schema && pnpm build:schemas

      - name: Upload schema artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-assets
          path: hdf-schema/dist/schemas/*.schema.json
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, build-cli, build-schemas]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download CLI binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-binaries
          path: cli-dist

      - name: Download schema assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: schema-assets
          path: schema-dist

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD | head -50)
          else
            NOTES=$(git log --oneline HEAD~20..HEAD)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        id: assets
        run: |
          mkdir -p release-assets

          # CLI binaries (archives + checksums from goreleaser)
          cp cli-dist/*.tar.gz cli-dist/*.zip cli-dist/checksums.txt release-assets/ 2>/dev/null || true

          # Schema files
          cp schema-dist/*.schema.json release-assets/

          ls -la release-assets/

      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ## Installation

            ```bash
            # TypeScript/Node.js
            npm install @mitre/hdf-schema @mitre/hdf-converters

            # Go CLI — download a binary for your platform from the assets below, then:
            chmod +x hdf && sudo mv hdf /usr/local/bin/
            ```

            ## Schema Files

            Bundled JSON schemas are attached as release assets and hosted at:
            https://mitre.github.io/hdf-libs/schemas/
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Create Go module version tags
        run: |
          VERSION="${GITHUB_REF_NAME}"

          # Each Go module needs a tag with its subdirectory prefix
          # so the Go module proxy can discover the correct version.
          GO_MODULES=(
            "hdf-converters"
            "hdf-schema/dist/go"
            "hdf-mappings/go"
            "hdf-validators/go"
            "hdf-parsers/go"
            "hdf-generators/go"
            "hdf-cli"
          )

          for mod in "${GO_MODULES[@]}"; do
            TAG="${mod}/${VERSION}"
            echo "Creating tag: ${TAG}"
            git tag "${TAG}"
          done

          git push origin --tags
