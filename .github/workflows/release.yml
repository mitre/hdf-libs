name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Update all package versions to match the tag
          pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish packages (dry run on pre-release tags)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc

          # Publish order matters: dependencies first
          PACKAGES=(
            hdf-schema
            hdf-utilities
            hdf-mappings
            hdf-validators
            hdf-parsers
            hdf-converters
            hdf-generators
            hdf-diff
            hdf-extension-graph
          )

          # Pre-release tags (v2.0.0-rc.1) publish with --tag next
          TAG_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_FLAG="--tag next"
          fi

          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing $pkg@$VERSION..."
            cd "$pkg"
            pnpm publish --no-git-checks $TAG_FLAG
            cd ..
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD | head -50)
          else
            NOTES=$(git log --oneline HEAD~20..HEAD)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ## Installation

            ```bash
            # TypeScript/Node.js
            npm install @mitre/hdf-schema @mitre/hdf-converters

            # Go CLI
            go install github.com/mitre/hdf-cli/cmd/hdf@${{ github.ref_name }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
