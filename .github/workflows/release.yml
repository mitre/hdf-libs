name: Release

on:
  push:
    tags:
      - 'v*'

# NOTE: Per-job permissions below. No workflow-level permissions block
# so each job gets only what it needs.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# NODE_VERSION pinned to the current LTS (22). Matches each published
# package's `engines.node: ">=22.0.0"`.
env:
  NODE_VERSION: '22'
  GO_VERSION: '1.26.2'

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish packages
        # Uses a granular access token scoped to the 9 @mitre/hdf-* packages.
        # Token is stored as NPM_TOKEN in the repo's GitHub Actions secrets.
        # Granular tokens have a 90-day max lifetime — rotate before expiry.
        #
        # We use token auth instead of Trusted Publishing (OIDC) because
        # @mitre/hdf-converters has its Trusted Publisher configured for
        # mitre/heimdall2 (which still publishes v2.x patches), and npm
        # only allows one Trusted Publisher per package.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publish order matters: dependencies first
          PACKAGES=(
            hdf-schema
            hdf-utilities
            hdf-mappings
            hdf-validators
            hdf-parsers
            hdf-converters
            hdf-generators
            hdf-diff
            hdf-extension-graph
          )

          # Pre-release tags publish with npm dist-tag `next` instead of `latest`.
          # Convention for this repo: `rc` is the only pre-release identifier.
          # Any tag with `-rc` in it (e.g. v3.1.0-rc.1, v3.1.0-rc.2) is a
          # pre-release; a bare semver tag (v3.1.0) is a stable release.
          TAG_FLAG=""
          if [[ "$VERSION" == *"-rc"* ]]; then
            TAG_FLAG="--tag next"
          fi

          # Use pnpm publish (not npm) so that workspace:* dependency specifiers
          # are rewritten to the actual published versions in the tarball.
          # npm publish ships package.json verbatim and breaks consumers with
          # EUNSUPPORTEDPROTOCOL. --no-git-checks is required because the
          # "Set version from tag" step above leaves the working tree dirty.
          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing $pkg@$VERSION..."
            cd "$pkg"
            pnpm publish --access public --no-git-checks $TAG_FLAG
            cd ..
          done

  build-cli:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.15.2"
          args: release --clean --skip=publish
          workdir: hdf-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-binaries
          path: hdf-cli/dist/*
          retention-days: 1

  build-schemas:
    name: Build schema assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup

      - name: Build schemas
        run: cd hdf-schema && pnpm build:schemas

      - name: Upload schema artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-assets
          path: hdf-schema/dist/schemas/*.schema.json
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, build-cli, build-schemas]
    permissions:
      contents: write  # create GitHub Release + push Go module tags
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: cli-dist

      - name: Download schema assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schema-assets
          path: schema-dist

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD | head -50)
          else
            NOTES=$(git log --oneline HEAD~20..HEAD)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        id: assets
        run: |
          mkdir -p release-assets

          # CLI binaries (archives + checksums from goreleaser)
          cp cli-dist/*.tar.gz cli-dist/*.zip cli-dist/checksums.txt release-assets/ 2>/dev/null || true

          # Schema files
          cp schema-dist/*.schema.json release-assets/

          ls -la release-assets/

      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ## Installation

            ```bash
            # TypeScript/Node.js
            npm install @mitre/hdf-schema @mitre/hdf-converters

            # Go CLI — download a binary for your platform from the assets below, then:
            chmod +x hdf && sudo mv hdf /usr/local/bin/
            ```

            ## Schema Files

            Bundled JSON schemas are attached as release assets and hosted at:
            https://mitre.github.io/hdf-libs/schemas/
          files: release-assets/*
          draft: false
          # Convention: any tag with `-rc` in it is a pre-release (see
          # publish-npm job for the matching check). A bare semver tag
          # (v3.1.0) creates a stable release.
          prerelease: ${{ contains(github.ref_name, '-rc') }}

      - name: Create Go module version tags
        run: |
          VERSION="${GITHUB_REF_NAME}"

          GO_MODULES=(
            "hdf-converters"
            "hdf-schema/dist/go"
            "hdf-mappings/go"
            "hdf-validators/go"
            "hdf-parsers/go"
            "hdf-generators/go"
            "hdf-cli"
          )

          for mod in "${GO_MODULES[@]}"; do
            TAG="${mod}/${VERSION}"
            echo "Creating tag: ${TAG}"
            git tag "${TAG}"
          done

          git push origin --tags
