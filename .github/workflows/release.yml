name: Release

on:
  push:
    tags:
      - 'v*'

# Deny-by-default; every job declares exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.26.6'

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # OIDC for trusted publishing + provenance signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          # No dependency caching in a publish workflow: a poisoned cache
          # seeded from a PR job could tamper with what gets published.
          package-manager-cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish packages
        # Auth is OIDC Trusted Publishing for every package below; there is
        # no npm token in this workflow, so a package without a trusted
        # publisher for this repo fails to publish rather than falling back.
        # pnpm publishes natively (no npm CLI delegation) with OIDC support
        # from pnpm 11.0.7, so the exact version matters: it comes from the
        # root package.json `packageManager` field, which pnpm/action-setup
        # resolves above.
        #
        # npm allows up to 10 trusted publishers per package, so
        # @mitre/hdf-converters carries this repo's publisher ALONGSIDE
        # mitre/heimdall2's (which still publishes v2.x patches) — neither
        # displaces the other.
        #
        # --provenance attests every package (requires the id-token
        # permission and the correct public repository field in each
        # package.json).
        run: |
          # Publish order matters: dependencies first
          PACKAGES=(
            hdf-schema
            hdf-utilities
            hdf-mappings
            hdf-validators
            hdf-parsers
            hdf-converters
            hdf-generators
            hdf-diff
            hdf-extension-graph
            hdf-engine
          )

          # Pre-release tags publish with npm dist-tag `next` instead of `latest`.
          # Convention for this repo: `rc` is the only pre-release identifier.
          # Any tag with `-rc` in it (e.g. v3.1.0-rc.1, v3.1.0-rc.2) is a
          # pre-release; a bare semver tag (v3.1.0) is a stable release.
          #
          # @mitre/hdf-converters is special-cased: its npm name is shared with
          # heimdall2, which still publishes the 2.x line and owns `latest`.
          # A stable publish with no --tag steals `latest`, so a plain
          # `npm install @mitre/hdf-converters` would hand v2 consumers an
          # API-incompatible v3. Policy agreed with the heimdall2 team:
          # hdf-converters stables publish under `next`, rc's under `rc` —
          # never `latest`, implicit or explicit. (A per-major `v3` alias was
          # planned but is impossible: npm rejects any dist-tag name that
          # parses as a semver range. Revisit a legal alias, e.g. `latest-3`,
          # only if a v4 line ever forks.)
          # Do NOT "simplify" this back into one shared TAG_FLAG.

          # Use pnpm publish (not npm) so that workspace:* dependency specifiers
          # are rewritten to the actual published versions in the tarball.
          # npm publish ships package.json verbatim and breaks consumers with
          # EUNSUPPORTEDPROTOCOL. --no-git-checks is required because the
          # "Set version from tag" step above leaves the working tree dirty.
          #
          # The loop is idempotent. npm versions are immutable, so a re-run of
          # a release whose earlier attempt published some packages would 403
          # on each of those and never converge. Before publishing, ask the
          # registry whether this exact version exists: 404 means publish;
          # 200 means compare CONTENT and skip only if it is the same build;
          # anything else means the answer is unknown, and guessing either
          # way is wrong (a transport failure aborts the step through curl's
          # own exit). "Same build" is judged on CONTENT, not on the
          # registry's integrity field, which hashes the gzip envelope and
          # varies with the producer's OS byte. Two measurements shaped the
          # digest below: rc.2 rebuilt from its tag on another machine
          # matched byte-for-byte inside the tarball, except that pnpm's
          # workspace: rewrite does not keep package.json key order stable
          # between builds (same commit, same pnpm 11.10.0, two dependency
          # keys swapped). So every file is hashed by path, with package.json
          # taken as canonical JSON.
          content_digest() {
            local dir
            dir=$(mktemp -d)
            tar -xzf "$1" -C "$dir"
            jq -S . "$dir/package/package.json" > "$dir/package/package.json.canonical"
            rm "$dir/package/package.json"
            (cd "$dir" && find . -type f | LC_ALL=C sort | xargs sha256sum | sha512sum | cut -d' ' -f1)
          }
          REGISTRY="https://registry.npmjs.org"
          for pkg in "${PACKAGES[@]}"; do
            TAG_FLAG=""
            if [[ "$pkg" == "hdf-converters" ]]; then
              if [[ "$VERSION" == *"-rc"* ]]; then
                TAG_FLAG="--tag rc"
              else
                TAG_FLAG="--tag next"
              fi
            elif [[ "$VERSION" == *"-rc"* ]]; then
              TAG_FLAG="--tag next"
            fi

            name="@mitre/$pkg"
            meta="$RUNNER_TEMP/$pkg.version.json"
            code=$(curl -sS -o "$meta" -w '%{http_code}' "$REGISTRY/${name/\//%2f}/$VERSION")
            case "$code" in
              404) ;;
              200)
                curl -sS -o "$RUNNER_TEMP/$pkg.published.tgz" "$(jq -r .dist.tarball "$meta")"
                (cd "$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/pack-$pkg" >/dev/null)
                published=$(content_digest "$RUNNER_TEMP/$pkg.published.tgz")
                fresh=$(content_digest "$RUNNER_TEMP/pack-$pkg/"*.tgz)
                if [ "$published" = "$fresh" ]; then
                  echo "Skipping $name@$VERSION: already published with identical content (digest $fresh)"
                  continue
                fi
                echo "::error::$name@$VERSION is already published with DIFFERENT content: published digest $published, this build $fresh. Versions are immutable, and this run is not a retry of the run that published it."
                exit 1
                ;;
              *)
                echo "::error::registry check for $name@$VERSION returned HTTP $code; cannot tell whether it is already published"
                exit 1
                ;;
            esac

            echo "Publishing $name@$VERSION ${TAG_FLAG:-"(latest)"}..."
            cd "$pkg"
            pnpm publish --access public --no-git-checks --provenance $TAG_FLAG
            cd ..
          done

  build-cli:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # ambient OIDC for cosign keyless signing + attestation
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No module caching in a publish workflow: a poisoned cache seeded
          # from a PR job could tamper with the released binaries.
          cache: false

      # syft + cosign back the goreleaser sboms:/signs: sections.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.15.2"
          args: release --clean --skip=publish
          workdir: hdf-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA Build L2 provenance for every artifact listed in checksums.txt
      # (archives + SBOMs). Consumers verify with:
      #   gh attestation verify <asset> --repo mitre/hdf-libs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: hdf-cli/dist/checksums.txt

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: hdf-cli/dist/*
          retention-days: 1

  build-schemas:
    name: Build schema assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build schemas
        run: cd hdf-schema && pnpm build:schemas

      - name: Upload schema artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-assets
          path: hdf-schema/dist/schemas/*.schema.json
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, build-cli, build-schemas]
    permissions:
      contents: write  # create GitHub Release + push Go module tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: cli-dist

      - name: Download schema assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schema-assets
          path: schema-dist

      - name: Generate release notes
        id: notes
        run: |
          # Find previous stable release tag reachable from HEAD (skip pre-release tags like -rc)
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --merged HEAD -l 'v*' --sort=-v:refname | grep -v '-' | grep -Fvx "$CURRENT_TAG" | head -1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD | head -50)
          else
            NOTES=$(git log --oneline HEAD~20..HEAD)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        id: assets
        run: |
          mkdir -p release-assets

          # CLI binaries + supply-chain artifacts from goreleaser: archives,
          # one SPDX SBOM per archive, checksums.txt, and the cosign bundle
          # over it. A release with fewer assets than that is not a release,
          # so this step asserts the set before anything is attached. The
          # expected set comes from checksums.txt, goreleaser's own manifest
          # of every archive and SBOM, so it moves with the goreleaser config;
          # the floor below is independent of it, so a truncated manifest
          # cannot vouch for itself.
          manifest=cli-dist/checksums.txt
          test -s "$manifest" || { echo "::error::$manifest is missing or empty"; exit 1; }
          test -s "$manifest.bundle" || { echo "::error::$manifest.bundle (the cosign signature) is missing or empty"; exit 1; }
          while read -r _ f; do
            test -s "cli-dist/$f" || { echo "::error::$f is listed in checksums.txt but missing from cli-dist"; exit 1; }
          done < "$manifest"
          archives=$(grep -cE '\.(tar\.gz|zip)$' "$manifest")
          sboms=$(grep -c '\.spdx\.json$' "$manifest")
          if [ "$archives" -lt 5 ] || [ "$sboms" -ne "$archives" ]; then
            echo "::error::checksums.txt lists $archives archives and $sboms SBOMs; expected at least 5 archives with one SBOM each"
            exit 1
          fi
          (cd cli-dist && sha256sum -c checksums.txt)
          cp cli-dist/*.tar.gz cli-dist/*.zip cli-dist/*.spdx.json \
             "$manifest" "$manifest.bundle" release-assets/

          # Schema files (bash -e: an unmatched glob makes cp fail here)
          cp schema-dist/*.schema.json release-assets/

          ls -la release-assets/

      - name: Create GitHub Release
        # Uses the runner's built-in `gh` instead of a third-party release
        # action — one less external dependency in the publish chain.
        # NOTES goes through env (not inline ${{ }}) because it is built from
        # commit subjects, which are attacker-influenceable text.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          {
            echo "## Changes"
            echo
            echo "$NOTES"
            cat <<'EOF'

          ## Installation

          ```bash
          # TypeScript/Node.js — install the packages you need
          npm install @mitre/hdf-converters@next   # converters + schema + parsers + utilities + mappings
          # (bare `latest` on @mitre/hdf-converters belongs to the heimdall2 v2 line — use @next, @rc, or an exact version)
          npm install @mitre/hdf-validators    # schema validation
          npm install @mitre/hdf-diff          # structural diff engine
          npm install @mitre/hdf-engine        # detection, query, compliance rollups
          npm install @mitre/hdf-generators    # InSpec profile generation
          npm install @mitre/hdf-extension-graph  # profile/baseline extension chains

          # Go libraries — hdf-converters pulls in schema, parsers, utilities,
          # mappings and validators; the rest are independent modules. hdf-cli is
          # deliberately absent despite being tagged: its go.mod carries replace
          # directives, so `go install` refuses it outright — it ships as a binary,
          # covered below.
          EOF
            for gomod in hdf-converters hdf-diff/go hdf-engine/go hdf-extension-graph/go hdf-generators/go; do
              echo "go get github.com/mitre/hdf-libs/${gomod}/v3@${GITHUB_REF_NAME}"
            done
            cat <<'EOF'

          # Go CLI — download a binary for your platform from the assets below, then:
          chmod +x hdf && sudo mv hdf /usr/local/bin/
          ```

          ## Schema Files

          Bundled JSON schemas are attached as release assets and hosted at:
          https://mitre.github.io/hdf-libs/schemas/
          EOF
          } > release-notes.md

          # Convention: any tag with `-rc` in it is a pre-release (see
          # publish-npm job for the matching check). A bare semver tag
          # (v3.1.0) creates a stable release.
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *"-rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG

      - name: Create Go module version tags
        # Checkout runs with persist-credentials: false, so the push
        # authenticates explicitly here — credentials scoped to this one
        # step instead of sitting in .git/config for the whole job.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"

          GO_MODULES=(
            "hdf-converters"
            "hdf-schema/dist/go"
            "hdf-mappings/go"
            "hdf-validators/go"
            "hdf-parsers/go"
            "hdf-generators/go"
            "hdf-utilities/go"
            "hdf-diff/go"
            "hdf-extension-graph/go"
            "hdf-engine/go"
            "hdf-cli"
          )

          for mod in "${GO_MODULES[@]}"; do
            TAG="${mod}/${VERSION}"
            echo "Creating tag: ${TAG}"
            git tag "${TAG}"
          done

          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags

  deploy-site:
    name: Deploy schema site
    needs: create-release
    # Stable releases only — never publish docs for a pre-release (-rc) tag.
    if: ${{ !contains(github.ref_name, '-rc') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/deploy-schemas.yml
