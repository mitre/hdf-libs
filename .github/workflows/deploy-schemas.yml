name: Deploy Schema Site

on:
  # Fire on production GitHub Releases (release.yml creates these from
  # tag pushes). Excludes pre-releases (release.types: released, not
  # published) so the hosted schemas at mitre.github.io/hdf-libs/schemas/
  # always reflect the latest stable release, never an RC. Switch to
  # `[published]` if you want pre-release docs to deploy too.
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# NODE_VERSION pinned to the current LTS (22). Matches each published
# package's `engines.node: ">=22.0.0"` and the version used by ci.yml,
# pre-release.yml, and release.yml.
env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build and deploy schema site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build schemas
        run: cd hdf-schema && pnpm build:schemas

      - name: Generate docs and build VitePress site
        run: cd site && pnpm generate && pnpm exec vitepress build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
