name: Deploy Schema Site

on:
  push:
    branches:
      - main
    paths:
      - 'hdf-schema/src/schemas/**'
      - 'site/**'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy schema site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build schemas
        run: cd hdf-schema && pnpm build:schemas

      - name: Generate docs and build VitePress site
        run: cd site && pnpm generate && pnpm exec vitepress build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v4
