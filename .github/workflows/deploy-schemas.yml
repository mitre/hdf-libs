name: Deploy Schema Site

on:
  # Invoked as a reusable workflow by release.yml's deploy-site job after a
  # successful stable release (release.yml gates out -rc pre-release tags), so
  # mitre.github.io/hdf-libs always reflects the latest stable release.
  workflow_call:
  # Manual redeploy of current main — e.g. to recover a missed deploy or after
  # fixing the site outside a release.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# NODE_VERSION pinned to the current LTS (22). Matches each published
# package's `engines.node: ">=22.0.0"` and the version used by ci.yml,
# pre-release.yml, and release.yml.
env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build and deploy schema site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build schemas
        run: cd hdf-schema && pnpm build:schemas

      - name: Generate docs and build VitePress site
        run: cd site && pnpm generate && pnpm exec vitepress build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
