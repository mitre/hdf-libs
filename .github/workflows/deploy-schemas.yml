name: Deploy Schema Site

on:
  # Fire on production GitHub Releases (release.yml creates these from
  # tag pushes). Excludes pre-releases (release.types: released, not
  # published) so the hosted schemas at mitre.github.io/hdf-libs/schemas/
  # always reflect the latest stable release, never an RC. Switch to
  # `[published]` if you want pre-release docs to deploy too.
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy schema site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup

      - name: Build schemas
        run: cd hdf-schema && pnpm build:schemas

      - name: Generate docs and build VitePress site
        run: cd site && pnpm generate && pnpm exec vitepress build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
