name: Trusted HDF gate CLI

on:
  workflow_call:

permissions:
  contents: read

env:
  # Temporary reviewed-main pin for evidence commands; restore a checksum-verified release after 3.8.0.
  HDF_CLI_SOURCE_SHA: '5f248c0bfd81d812ad16d4ea53f26c8965895eff'

jobs:
  gate-cli:
    name: Build the gate CLI (pinned main commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitre/hdf-libs
          ref: ${{ env.HDF_CLI_SOURCE_SHA }}
          path: gate-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gate-source/go.work
          cache: false
      - name: Build the reviewed CLI
        working-directory: gate-source/hdf-cli
        run: |
          test "$(git rev-parse HEAD)" = "$HDF_CLI_SOURCE_SHA"
          go build -mod=readonly \
            -ldflags "-X github.com/mitre/hdf-libs/hdf-cli/v3/cmd/hdf/cmd.commit=$HDF_CLI_SOURCE_SHA" \
            -o "$RUNNER_TEMP/hdf" ./cmd/hdf
          "$RUNNER_TEMP/hdf" version
          "$RUNNER_TEMP/hdf" evidence --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-cli
          path: ${{ runner.temp }}/hdf
          retention-days: 7
