name: Dependency Review

# Gates the PR's dependency *delta* (pnpm + gomod, via the dependency graph)
# on known-vulnerability severity and license policy. Complements the
# pnpm audit / govulncheck steps in ci.yml, which scan the current tree
# rather than what a PR is adding.

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review PR dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # comment-summary-in-pr below posts the failure summary, which the action
      # cannot do read-only; without this the step fails exactly when it has
      # something to report.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # Licenses that would make this Apache-2.0 library undistributable
          # (strong copyleft) or restrict downstream commercial/hosted use.
          # Weak copyleft (LGPL/MPL/EPL) is deliberately allowed.
          deny-licenses: >-
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            SSPL-1.0,
            BUSL-1.1,
            CC-BY-NC-4.0
          comment-summary-in-pr: on-failure
