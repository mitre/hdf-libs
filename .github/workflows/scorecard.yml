name: Scorecard

# OpenSSF Scorecard supply-chain posture analysis. Results publish to the
# public Scorecard API (the README badge) and upload as SARIF to the
# repository's code-scanning tab.

on:
  schedule:
    - cron: '0 8 * * 2'
  push:
    branches: [main]
  # Re-run when branch protection changes, since Scorecard scores it.
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Needed to upload SARIF results to code scanning.
      security-events: write
      # Needed by publish_results to sign the results with OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
