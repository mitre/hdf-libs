name: Scorecard

# OpenSSF Scorecard supply-chain posture analysis. Results publish to the
# public Scorecard API (the README badge) and upload as SARIF to the
# repository's code-scanning tab.

on:
  schedule:
    - cron: '0 8 * * 2'
  push:
    branches: [main]
  # Re-run when branch protection changes, since Scorecard scores it.
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Needed to upload SARIF results to code scanning.
      security-events: write
      # Needed by publish_results to sign the results with OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
