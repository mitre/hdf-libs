name: Workflow Lint

# Static security analysis of the workflow files themselves (credential
# persistence, cache poisoning, template injection, impostor pins).
# Annotation mode (advanced-security: false) needs no security-events
# permission, so it also runs on PRs from forks.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan so newly added zizmor audits surface without a PR.
    - cron: '30 6 * * 1'

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: '1.30.0'
          advanced-security: 'false'
