name: Workflow Lint

# Static security analysis of the workflow files themselves (credential
# persistence, cache poisoning, template injection, impostor pins).
# Annotation mode (advanced-security: false) needs no security-events
# permission.
#
# Weekly re-scan only: push/PR runs live in ci.yml's scan-workflows job,
# which emits SARIF and gates the pipeline through the HDF threshold check
# (gate-hdf-scans). This schedule exists so newly added zizmor audits surface
# without waiting for a PR.

on:
  schedule:
    - cron: '30 6 * * 1'

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: '1.30.0'
          advanced-security: 'false'
