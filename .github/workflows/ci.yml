name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.beads/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.beads/**'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NODE_VERSION pinned to the current LTS (24). Matches each published
# package's `engines.node: ">=24.0.0"`. Node 22 enters Maintenance LTS
# 2025-10 and EOLs 2027-04; Node 24 has Active LTS through 2026-10 and
# EOL 2028-04, so it gives the longest forward runway.
env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26.2'
  GOLANGCI_LINT_VERSION: 'v2.11.3'

# ─── Pipeline ──────────────────────────────────────────────────────────────
#
#   check-ts ─┐
#   check-go ─┤── gate ── build ──┬── test-ts
#                                 ├── test-go
#                                 └── coverage
#
# Gate phase: lint + typecheck + security (2 parallel jobs).
# Build phase: build once, upload artifacts (ubuntu).
# Test phase: test on ubuntu + windows matrix.

jobs:
  # ── Gate: TypeScript checks ──────────────────────────────────────────────
  check-ts:
    name: Check TypeScript (lint + typecheck + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build TypeScript (required for cross-package type resolution)
        run: pnpm build:ts
      - name: ESLint
        run: pnpm -r --filter=!. --filter=!hdf-cli run lint
      - name: tsc --noEmit
        run: pnpm -r --filter=!. --filter=!hdf-cli run type-check
      - name: npm audit (prod=moderate, dev=high)
        run: pnpm run security:ts

  # ── Gate: Go checks ─────────────────────────────────────────────────────
  check-go:
    name: Check Go (lint + security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          go: 'true'
      - name: Build TypeScript (Go modules need hdf-schema/dist/go/)
        run: pnpm build:ts
      - name: Install Go security tooling
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
      # Each Go-having package defines lint:go / security:vuln / security:sast.
      # The root scripts fan out via pnpm -r and serialize (golangci-lint
      # holds a process-level lock that breaks under parallel invocation).
      # Auto-covers any new hdf-* package that adds the same scripts.
      - name: golangci-lint (all Go modules)
        run: pnpm run lint:go
      - name: govulncheck (all Go modules)
        run: pnpm run security:vuln:go
      - name: gosec (all Go modules)
        run: pnpm run security:sast:go

  # ── Build (once, share artifacts) ────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-ts, check-go]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          go: 'true'
      - name: Build TypeScript
        run: pnpm build:ts
      - name: Verify TS artifacts
        # Self-discover: any hdf-* package whose package.json declares a
        # ./dist/-rooted main entry should have a built dist/ on disk.
        # Auto-covers new TS packages without needing a CI list update.
        run: |
          found=0
          for pkg_json in hdf-*/package.json; do
            pkg=$(dirname "$pkg_json")
            grep -q '"main": *"\./dist/' "$pkg_json" || continue
            [ -d "$pkg/dist" ] && echo "✓ $pkg/dist" || { echo "✗ $pkg/dist missing"; exit 1; }
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "✗ no TS packages discovered — glob/grep broken?"; exit 1; }
          echo "Verified $found TS package(s)."
      - name: Build Go CLI
        run: pnpm build:go
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          # Glob auto-covers any new hdf-* package's dist/ on build.
          path: hdf-*/dist/
          retention-days: 1

  # ── Test TypeScript ──────────────────────────────────────────────────────
  test-ts:
    name: Test TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Test TypeScript (all packages)
        run: pnpm test:ts
      - name: Export-contract gate (three-artifact rule)
        run: pnpm test:exports

  # ── Test Go ──────────────────────────────────────────────────────────────
  test-go:
    name: Test Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          go: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Test Go (all packages)
        run: pnpm test:go
      - name: Test hdf-cli
        run: cd hdf-cli && go test ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: cd hdf-cli && go test -race ./...

  # ── Coverage ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          go: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: TypeScript coverage
        run: pnpm -r --filter=!. --filter=!hdf-cli run test:coverage
      - name: Go coverage (workspace packages)
        # Self-discover: every hdf-*/go/ with a go.mod gets coverage.
        # hdf-converters and hdf-cli have their own dedicated steps below
        # because their Go layouts don't follow the hdf-*/go/ convention.
        run: |
          found=0
          for dir in hdf-*/go; do
            [ -f "$dir/go.mod" ] || continue
            echo "=== $dir ==="
            (cd "$dir" && go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1)
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "✗ no Go workspace packages discovered"; exit 1; }
          echo "Covered $found Go workspace package(s)."
      - name: Go coverage (hdf-converters)
        run: |
          cd hdf-converters
          go test -coverprofile=coverage.out ./registry/... ./converters/*/go/ ./shared/go/
          go tool cover -func=coverage.out | tail -1
      - name: Go coverage (hdf-cli)
        run: |
          cd hdf-cli
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-reports
          path: |
            **/coverage
            **/coverage.out
          retention-days: 30
