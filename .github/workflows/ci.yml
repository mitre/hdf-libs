name: CI

on:
  push:
    branches:
      - main
      - hdf-libs-development
  pull_request:
    branches:
      - main
      - hdf-libs-development

env:
  NODE_VERSION: '20.x'
  GO_VERSION: '1.25.7'
  TS_PACKAGES: 'hdf-schema hdf-utilities hdf-mappings hdf-validators hdf-parsers hdf-converters'

jobs:
  # Full pipeline: build, lint, test, security (all languages)
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Build ---
      - name: Build TypeScript packages
        run: pnpm build:ts

      - name: Build Go CLI
        run: pnpm build:go

      - name: Verify build artifacts
        run: |
          for pkg in ${{ env.TS_PACKAGES }}; do
            [ -d "$pkg/dist" ] && echo "OK: $pkg/dist" || { echo "FAIL: $pkg/dist not found"; exit 1; }
          done
          [ -f "hdf-cli/hdf" ] && echo "OK: hdf-cli/hdf" || { echo "FAIL: hdf-cli/hdf not found"; exit 1; }

      # --- Lint ---
      - name: Lint TypeScript
        run: pnpm -r --filter '!hdf-cli' run lint

      - name: Lint Go
        run: pnpm --filter hdf-cli run lint

      # --- Test ---
      - name: Test TypeScript
        run: pnpm test:ts

      - name: Test Go
        run: pnpm test:go

      - name: Test Go (race detector)
        run: cd hdf-cli && go test -race ./...

      - name: Test TypeScript (coverage)
        run: pnpm test:coverage
        continue-on-error: true

      # --- Security ---
      - name: npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd hdf-cli && govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd hdf-cli && gosec ./...
        continue-on-error: true

      # --- Artifacts ---
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            **/coverage
            **/coverage.out
          retention-days: 30

  # Verify TypeScript-only build works without Go (for submodule consumers)
  build-ts-only:
    name: Build (TypeScript only, no Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build:ts

      - name: Verify TypeScript build artifacts
        run: |
          for pkg in ${{ env.TS_PACKAGES }}; do
            [ -d "$pkg/dist" ] && echo "OK: $pkg/dist" || { echo "FAIL: $pkg/dist not found"; exit 1; }
          done

      - name: Test TypeScript
        run: pnpm test:ts
