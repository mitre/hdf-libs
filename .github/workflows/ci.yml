name: CI

on:
  push:
  pull_request:

# Cancel in-progress runs for the same branch/PR — only latest matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.26.1'
  GOLANGCI_LINT_VERSION: 'v2.11.3'
  TS_PACKAGES: 'hdf-schema hdf-utilities hdf-mappings hdf-validators hdf-parsers hdf-converters hdf-diff'

# ─── Jobs ────────────────────────────────────────────────────────────────────
# All jobs that touch Go code require a TS build first because Go modules
# use `replace` directives pointing at ../hdf-schema/dist/go/ which is
# generated by `pnpm build:ts`.

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint-ts:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter=!hdf-cli run lint

  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Build TS (generates Go types in hdf-schema/dist/go/)
        run: pnpm build:ts
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: cd hdf-cli && golangci-lint run

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript
        run: pnpm build:ts
      - name: Verify TS build artifacts
        run: |
          for pkg in ${{ env.TS_PACKAGES }}; do
            [ -d "$pkg/dist" ] && echo "✓ $pkg/dist" || { echo "✗ $pkg/dist not found"; exit 1; }
          done
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Build Go CLI
        run: pnpm build:go
      - name: Verify Go build artifact
        run: |
          [ -f "hdf-cli/hdf" ] && echo "✓ hdf-cli/hdf" || { echo "✗ hdf-cli/hdf not found"; exit 1; }

  # ── Test (matrix across platforms) ─────────────────────────────────────────
  test:
    name: Test (${{ matrix.lang }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lang: [typescript, go]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript (generates types + Go schemas)
        run: pnpm build:ts
      - name: Verify build artifacts
        shell: bash
        run: |
          for pkg in hdf-schema hdf-utilities hdf-mappings hdf-validators hdf-parsers hdf-converters hdf-diff; do
            [ -d "$pkg/dist" ] && echo "✓ $pkg/dist" || { echo "✗ $pkg/dist not found"; exit 1; }
          done
          if [ "${{ matrix.lang }}" = "go" ]; then
            [ -f "hdf-schema/dist/go/hdf.go" ] && echo "✓ hdf-schema/dist/go/hdf.go" || { echo "✗ Go types not generated"; exit 1; }
          fi
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Test TypeScript
        if: matrix.lang == 'typescript'
        run: pnpm test:ts
      - name: Test Go
        if: matrix.lang == 'go'
        run: cd hdf-cli && go test ./...
      - name: Test Go (race detector)
        if: matrix.lang == 'go' && matrix.os == 'ubuntu-latest'
        run: cd hdf-cli && go test -race ./...

  # ── Coverage ───────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - uses: pnpm/action-setup@v4
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - name: TypeScript coverage (enforces thresholds)
        run: pnpm -r --filter=!hdf-cli run test:coverage
      - name: Go coverage
        run: |
          cd hdf-cli
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            **/coverage
            **/coverage.out
          retention-days: 30

  # ── Security ───────────────────────────────────────────────────────────────
  security-npm:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  security-go:
    name: Security (Go - govulncheck + gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Build TS (generates Go types in hdf-schema/dist/go/)
        run: pnpm build:ts
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd hdf-cli && govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd hdf-cli && gosec -exclude-generated ./...

  # ── TypeScript-only build (for consumers without Go) ───────────────────────
  build-ts-only:
    name: Build (TypeScript only, no Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - name: Verify build artifacts
        run: |
          for pkg in ${{ env.TS_PACKAGES }}; do
            [ -d "$pkg/dist" ] && echo "✓ $pkg/dist" || { echo "FAIL: $pkg/dist not found"; exit 1; }
          done
      - run: pnpm test:ts
