name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.beads/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.beads/**'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NODE_VERSION pinned to the current LTS (22). Matches each published
# package's `engines.node: ">=22.0.0"`. Node 20 reaches EOL 2026-04-30;
# we're not advertising support for a runtime that loses security patches
# during the lifetime of this release.
env:
  NODE_VERSION: '22'
  GO_VERSION: '1.26.2'
  GOLANGCI_LINT_VERSION: 'v2.11.3'

# ─── Pipeline ──────────────────────────────────────────────────────────────
#
#   check-ts ─┐
#   check-go ─┤── gate ── build ──┬── test-ts
#                                 ├── test-go
#                                 └── coverage
#
# Gate phase: lint + typecheck + security (2 parallel jobs).
# Build phase: build once, upload artifacts (ubuntu).
# Test phase: test on ubuntu + windows matrix.

jobs:
  # ── Gate: TypeScript checks ──────────────────────────────────────────────
  check-ts:
    name: Check TypeScript (lint + typecheck + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Build TypeScript (required for cross-package type resolution)
        run: pnpm build:ts
      - name: ESLint
        run: pnpm -r --filter=!hdf-cli run lint
      - name: tsc --noEmit
        run: pnpm -r --filter=!hdf-cli run type-check
      - name: npm audit
        run: pnpm audit --audit-level=high

  # ── Gate: Go checks ─────────────────────────────────────────────────────
  check-go:
    name: Check Go (lint + security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          go: 'true'
      - name: Build TypeScript (Go modules need hdf-schema/dist/go/)
        run: pnpm build:ts
      - name: golangci-lint (hdf-cli)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          cd hdf-cli && golangci-lint run
      - name: golangci-lint (hdf-converters)
        run: cd hdf-converters && golangci-lint run ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          cd hdf-cli && govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          cd hdf-cli && gosec -exclude=G304,G104,G115,G706 -exclude-generated ./...

  # ── Build (once, share artifacts) ────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-ts, check-go]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          go: 'true'
      - name: Build TypeScript
        run: pnpm build:ts
      - name: Verify TS artifacts
        run: |
          for pkg in hdf-schema hdf-utilities hdf-mappings hdf-validators hdf-parsers hdf-converters hdf-diff; do
            [ -d "$pkg/dist" ] && echo "✓ $pkg/dist" || { echo "✗ $pkg/dist missing"; exit 1; }
          done
      - name: Build Go CLI
        run: pnpm build:go
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts
          path: |
            hdf-schema/dist/
            hdf-utilities/dist/
            hdf-mappings/dist/
            hdf-validators/dist/
            hdf-parsers/dist/
            hdf-converters/dist/
            hdf-diff/dist/
          retention-days: 1

  # ── Test TypeScript ──────────────────────────────────────────────────────
  test-ts:
    name: Test TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Test TypeScript (all packages)
        run: pnpm test:ts

  # ── Test Go ──────────────────────────────────────────────────────────────
  test-go:
    name: Test Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          go: 'true'
          lfs: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Test Go (all packages)
        run: pnpm test:go
      - name: Test hdf-cli
        run: cd hdf-cli && go test ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: cd hdf-cli && go test -race ./...

  # ── Coverage ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          go: 'true'
          lfs: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: TypeScript coverage
        run: pnpm -r --filter=!hdf-cli run test:coverage
      - name: Go coverage (workspace packages)
        run: |
          for dir in hdf-mappings/go hdf-validators/go hdf-parsers/go; do
            echo "=== $dir ==="
            (cd $dir && go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1)
          done
      - name: Go coverage (hdf-converters)
        run: |
          cd hdf-converters
          go test -coverprofile=coverage.out ./registry/... ./converters/*/go/ ./shared/go/
          go tool cover -func=coverage.out | tail -1
      - name: Go coverage (hdf-cli)
        run: |
          cd hdf-cli
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/coverage
            **/coverage.out
          retention-days: 30
