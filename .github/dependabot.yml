version: 2

# Cooldown: wait 7 days after a release before raising a PR, matching
# the 7-day pnpm minimumReleaseAge in pnpm-workspace.yaml so both
# supply-chain delays agree. Reduces exposure to compromised releases,
# which are typically discovered and yanked well within that window.
# Security updates (CVEs) bypass cooldown entirely.

updates:
  # npm (pnpm workspace — single manifest at root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # typescript-eslint gates the maximum supported TypeScript version, so a TS
      # major bump breaks linting until typescript-eslint catches up (it crashes
      # with "typescript-eslint does not support TS <major>"). Hold TS majors and
      # adopt them manually once typescript-eslint supports them
      # (tracking: typescript-eslint#10940). Minor/patch TS updates still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # GitHub Actions (already SHA-pinned; cooldown for new action releases)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Go modules — each go.mod is a separate ecosystem entry
  # Go modules use go.sum checksums (content-addressed, like lockfile integrity).
  - package-ecosystem: "gomod"
    directory: "/hdf-cli"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/hdf-converters"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
