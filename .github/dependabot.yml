version: 2

# Cooldown: wait 7 days after a release before raising a PR, matching
# the 7-day pnpm minimumReleaseAge in pnpm-workspace.yaml so both
# supply-chain delays agree. Reduces exposure to compromised releases,
# which are typically discovered and yanked well within that window.
# Security updates (CVEs) bypass cooldown entirely.

updates:
  # npm (pnpm workspace — single manifest at root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # typescript-eslint gates the maximum supported TypeScript version, so a TS
      # major bump breaks linting until typescript-eslint catches up (it crashes
      # with "typescript-eslint does not support TS <major>"). Hold TS majors and
      # adopt them manually once typescript-eslint supports them
      # (tracking: typescript-eslint#10940). Minor/patch TS updates still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # GitHub Actions (already SHA-pinned; cooldown for new action releases)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # pip — the hash-pinned semgrep install used by the ci.yml scan step.
  # requirements.in holds the intent (semgrep==X); semgrep.txt is the
  # fully-resolved, hash-pinned output. Regenerate with
  #   uv pip compile requirements.in --generate-hashes --universal --python-version 3.11
  #
  # Only semgrep is allowed, because semgrep.txt is a solved resolution and
  # Dependabot edits one line at a time with no solver: bumping a transitive
  # pin contradicts a constraint semgrep already fixed and dies with
  # ResolutionImpossible. dependency-type "direct" would not narrow this —
  # a compiled requirements file pins everything explicitly, so every entry
  # reads as direct. Security updates ignore `allow` and still reach
  # transitives; routine drift is picked up by regenerating from the .in.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "semgrep"
    open-pull-requests-limit: 5

  # Go modules — consolidated across all Go workspace modules so shared
  # dependency bumps update every go.mod together instead of opening
  # cross-module UNTIDY PRs. Go modules use go.sum checksums
  # (content-addressed, like lockfile integrity).
  # hdf-schema/dist/go is deliberately absent: it has no external requires
  # (generated types module), so there is nothing for Dependabot to track.
  # open-pull-requests-limit: 5 is shared across this consolidated
  # multi-directory entry (previously 5 per module directory).
  - package-ecosystem: "gomod"
    directories:
      - "/hdf-cli"
      - "/hdf-converters"
      - "/hdf-diff/go"
      - "/hdf-engine/go"
      - "/hdf-extension-graph/go"
      - "/hdf-fixtures"
      - "/hdf-generators/go"
      - "/hdf-mappings/go"
      - "/hdf-parsers/go"
      - "/hdf-schema/testhdf/go"
      - "/hdf-utilities/go"
      - "/hdf-validators/go"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]
        group-by: dependency-name
    open-pull-requests-limit: 5
