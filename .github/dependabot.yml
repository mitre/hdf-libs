        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/hdf-parsers/go"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
