# SonarQube Cloud CI-based analysis (Automatic Analysis must stay OFF —
# it conflicts with CI scans and cannot ingest coverage).
# One project for the whole monorepo; the scanner is multi-language.

sonar.organization=mitre
sonar.projectKey=mitre_hdf-libs

# Whole repo as sources; test classification and exclusions below carve it up.
sonar.sources=.

# Files matching these patterns are classified as test code, not sources.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*_test.go,\
  **/test/**,\
  hdf-cli/cmd/hdf/cmd/testdata/**

# Exclusions are load-bearing: generated output, real-tool fixture corpora,
# and the docs site would otherwise poison duplication and coverage numbers.
sonar.exclusions=\
  **/dist/**,\
  **/fixtures/**,\
  **/testdata/**,\
  **/coverage/**,\
  **/node_modules/**,\
  .pnpm-store/**,\
  .beads/**,\
  site/**,\
  dev-docs/**,\
  **/*.config.ts,\
  eslint.config.mjs

# Coverage ingestion — paths match what ci.yml's coverage job produces.
# TS: vitest per-package lcov (reporter includes 'lcov').
sonar.javascript.lcov.reportPaths=\
  hdf-schema/coverage/lcov.info,\
  hdf-utilities/coverage/lcov.info,\
  hdf-mappings/coverage/lcov.info,\
  hdf-validators/coverage/lcov.info,\
  hdf-parsers/coverage/lcov.info,\
  hdf-converters/coverage/lcov.info,\
  hdf-generators/coverage/lcov.info,\
  hdf-diff/coverage/lcov.info,\
  hdf-engine/coverage/lcov.info,\
  hdf-extension-graph/coverage/lcov.info

# Go: go test -coverprofile outputs.
sonar.go.coverage.reportPaths=\
  hdf-mappings/go/coverage.out,\
  hdf-validators/go/coverage.out,\
  hdf-parsers/go/coverage.out,\
  hdf-converters/coverage.out,\
  hdf-cli/coverage.out

# Fixture-corpus duplication is inherent to converter goldens; source dirs
# stay in scope for CPD.
sonar.cpd.exclusions=\
  **/fixtures/**,\
  **/testdata/**
