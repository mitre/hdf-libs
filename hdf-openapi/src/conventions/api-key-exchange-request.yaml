# ADR-0011 §3's api-key exchange: a long-lived key is traded for a short-lived bearer
# token, so service routes only ever see tokens. Same response as the oauth2 operation.
$schema: https://json-schema.org/draft/2020-12/schema
title: API Key Exchange Request
description: >-
  Exchanges an API key for a short-lived bearer token. The key never travels to a service
  route; only the token does.
type: object
additionalProperties: false
required: [api_key, resource]
properties:
  api_key:
    type: string
    minLength: 1
  resource:
    type: string
    format: uri
    description: RFC 8707 audience, required for the same reason as on the oauth2 grant.
  scope:
    type: string
    description: Space-delimited subset of the key's registered scopes.
examples:
  - api_key: hdfk_not-a-real-key
    resource: https://hdf.example.org/api
    scope: hdf:read
