# The ingest response. ADR-0008 §2 fixes the rewrite `handle` -> `id`, so the identifier a
# caller gets back is an opaque id rather than the MCP's handle, and §4 makes identity an
# opaque uuid rather than a content hash (challenge point (d)).
$schema: https://json-schema.org/draft/2020-12/schema
title: Document Created
description: The id a submitted document was stored under, and its content digest.
type: object
additionalProperties: false
required: [id]
properties:
  id:
    type: string
    format: uuid
    description: Opaque. A caller addresses the document by this and nothing else.
  sha256:
    type: string
    pattern: '^[0-9a-f]{64}$'
    description: >-
      Digest of the submitted bytes. Advisory, and the secondary key for idempotent
      re-ingest (Zalando #231) rather than an identifier a caller may address:
      condition a write on the `ETag` this response carries, not on this member.
examples:
  - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
