# How the MCP surface maps to HTTP.
#
# This file NAMES shapes; it never carries one. ADR-0008 §2 gives it a closed grammar and
# src/bindings.ts enforces both that and completeness against the live contract, so a new
# tool, resource or input field fails the build until it is bound, dropped or recorded
# absent. `class` is deliberately absent on every real tool: it derives from the tool's
# readOnlyHint, and hand-setting it is how a read-only tool acquires write scopes.
#
# Document addressing: MCP takes `{path}` or `{handle}`; HTTP takes an id. The fixed
# handle -> id rewrite supplies it, so a `source` placed in the path becomes `{id}` and the
# filesystem half is simply not exposed. The traversal and output inputs — directory,
# pattern, failFast, outputDir, output, overwrite, dryRun — are dropped everywhere they
# appear, because the service owns where bytes live.

tools:
  hdf_open:
    etag: true
    method: get
    path: /documents/{id}
    fields:
      source: { placement: path }
    # One operation, four response shapes: the summary is per document type, and the
    # generator discriminates on docType rather than widening to a union of everything.
    fullResponse:
      - open.summary.results
      - open.summary.baseline
      - open.summary.system
      - open.summary.plan

  hdf_query:
    method: get
    path: /documents/{id}/requirements
    items: requirements
    fields:
      source: { placement: path }
      sources: { placement: query }
      status: { placement: query, enumFrom: schema enum }
      severity: { placement: query, enumFrom: schema enum }
      verbosity: { placement: query, enumFrom: schema enum }
      fields: { placement: query, enumFrom: schema enum }
      baseline: { placement: query }
      baselineLabel: { placement: query }
      cci: { placement: query }
      cvss: { placement: query }
      cwe: { placement: query }
      disposition: { placement: query }
      epss: { placement: query }
      id: { placement: query }
      impact: { placement: query }
      kev: { placement: query }
      limit: { placement: query }
      nist: { placement: query }
      page: { placement: query }
      poamType: { placement: query }
      poams: { placement: query }
      rawImpact: { placement: query }
      search: { placement: query }
      tag: { placement: query }
    fullResponse:
      - query.concise
      - query.full

  hdf_compliance:
    method: get
    path: /documents/{id}/compliance
    fields:
      source: { placement: path }
      sources: { placement: query }
      groupBy: { placement: query, enumFrom: schema enum }
      threshold: { placement: query }
    # No fullResponse: engine.statusCounts and engine.thresholdConfig are PARTS of this
    # response, not alternatives to each other, and `fullResponse` names the response
    # shape. Its own output schema is otherwise fully typed; the registered shapes are
    # what its `counts` leaf needs, which Phase 3's parity work can wire per field.


  # Cross-document: the set is named by ids rather than by a single path segment, which is
  # why this is /requirements and not /documents/{id}/requirements.
  hdf_aggregate:
    method: get
    path: /requirements
    items: perSource
    fields:
      sources: { placement: query }
      status: { placement: query, enumFrom: schema enum }
      severity: { placement: query, enumFrom: schema enum }
      nist: { placement: query }
      page: { placement: query }
    # No fullResponse, for the same reason as hdf_compliance: the response CONTAINS counts
    # rather than being them.

  hdf_inspect:
    method: get
    path: /documents/{id}/structure
    fields:
      source: { placement: path }
      section: { placement: query }
      verbosity: { placement: query, enumFrom: schema enum }
      page: { placement: query }

  # A comparison is a resource in its own right, derived from two documents, so the two
  # operands are query parameters rather than path segments.
  hdf_diff:
    method: get
    path: /comparisons
    items: changes
    # The comparison-level rollup is envelope data, not a row, so it is named separately
    # from fullResponse, whose names become the row shape: listing it there would make it a
    # fourth alternative for a change row.
    summaryRef: diff.summary
    fields:
      from: { placement: query }
      to: { placement: query }
      mode: { placement: query, enumFrom: schema enum }
      verbosity: { placement: query, enumFrom: schema enum }
      page: { placement: query }
    drop:
      - name: dryRun
        reason: the service decides whether a write happens, not the caller
      - name: output
        reason: the comparison is returned, never written to a path
      - name: overwrite
        reason: no caller-named output to overwrite
    fullResponse:
      - diff.temporal.concise
      - diff.temporal.full
      - diff.system-drift.concise
      - diff.system-drift.full

  hdf_validate:
    method: post
    path: /validations
    fields:
      source: { placement: body }
      content: { placement: body }
      mode: { placement: query, enumFrom: schema enum }
      docType: { placement: query }

  hdf_convert:
    method: post
    path: /conversions
    items: batch
    fields:
      source: { placement: body }
      sources: { placement: body }
      content: { placement: body }
      componentId: { placement: body }
      labels: { placement: body }
      from: { placement: query, enumFrom: registry }
    drop:
      - name: directory
        reason: filesystem traversal; the service owns where bytes live
      - name: pattern
        reason: glob over a directory the service does not expose
      - name: failFast
        reason: batch-traversal control with no HTTP analogue
      - name: outputDir
        reason: the service decides where converted documents live
      - name: output
        reason: the conversion is returned or stored by id, never to a path
      - name: overwrite
        reason: no caller-named output to overwrite
      - name: dryRun
        reason: the service decides whether a write happens, not the caller
    fullResponse:
      - convert.batch.entry

  hdf_author:
    etag: true
    method: post
    path: /documents/authored
    fields:
      docType: { placement: body, enumFrom: schema enum }
      name: { placement: body }
      content: { placement: body }
      expiresAt: { placement: body }
      source: { placement: body }
    drop:
      - name: output
        reason: the authored document is stored by id, never to a path
      - name: overwrite
        reason: no caller-named output to overwrite
      - name: dryRun
        reason: the service decides whether a write happens, not the caller

  hdf_apply_amendment:
    etag: true
    method: post
    path: /documents/{id}/amendments
    fields:
      results: { placement: path }
      amendments: { placement: body }
    drop:
      - name: output
        reason: the amended document is stored by id, never to a path
      - name: overwrite
        reason: no caller-named output to overwrite
      - name: dryRun
        reason: the service decides whether a write happens, not the caller

# Operations MCP lacks. `class` and `scopes` are hand-set here and ONLY here: a synthetic
# operation has no readOnlyHint to derive from, which ADR-0008 §2 names as the documented
# exception to derivation. Every request and response shape is a conventions component, so
# this section still names shapes rather than carrying them.
synthetic:
  ingest:
    description: >-
      Store a document, returning the server-issued id that addresses it and the ETag that conditions later writes. Re-submitting identical bytes returns the existing id.
    method: post
    path: /documents
    etag: true
    class: write
    scopes:
      - hdf:read
      - hdf:write
    bodyRef: IngestRequest
    fullResponse: DocumentCreated

  deleteDocument:
    description: >-
      Delete a stored document. Conditional: the current ETag must be supplied in If-Match, and a document another cites, or one under a legal hold, is refused.
    method: delete
    path: /documents/{id}
    class: admin
    scopes:
      - hdf:read
      - hdf:write
      - hdf:admin
    # Declared, not derived: a synthetic operation raises no mcperr code, and the two 409
    # conditions are service concerns — a citing document restricting the delete (ADR-0009
    # §5) and a legal hold (ADR-0013) — that the MCP has no equivalent for.
    success: 204
    problems:
      '409':
        - delete-restricted
        - held
      '412':
        - handle-stale

  # Served by the authorization server rather than a service route, so documentOnly: it
  # appears in this document and is absent from the service's own emitted inventory.
  # security: [] is expressed by the empty scopes list, which Spectral's
  # operation-security-defined accepts.
  issueToken:
    description: >-
      Exchange client credentials for an access token. Served by the authorization server, so it carries no bearer requirement of its own.
    method: post
    path: /api/auth/oauth2/token
    class: documentOnly
    scopes: []
    bodyRef: TokenRequest
    fullResponse: TokenResponse

  exchangeApiKey:
    description: >-
      Exchange a long-lived API key for a short-lived access token, for callers that cannot hold client credentials.
    method: post
    path: /api/auth/api-key/exchange
    class: documentOnly
    scopes: []
    bodyRef: APIKeyExchangeRequest
    fullResponse: TokenResponse

resources:
  hdf-converter-catalog:
    description: >-
      The source formats this deployment can convert, which is the vocabulary the conversion request accepts.
    method: get
    path: /catalog/converters
  # The 24 hdf-enum-* resources in the contract are instances of this template, and are
  # covered by binding it rather than by a hand-kept list of 24 that rots when an enum is
  # added to the schema.
  hdf-enum:
    description: >-
      The members of one closed vocabulary the HDF schemas declare.
    method: get
    path: /enums/{name}
  hdf-schema-whole:
    description: >-
      The JSON Schema document for one HDF document type.
    method: get
    path: /schemas/{docType}
  hdf-schema-slice:
    description: >-
      One named definition from an HDF document type's schema.
    method: get
    path: /schemas/{docType}/{def}

absent:
  - resource: hdf-session-transcript
    reason: MCP session state, named by ADR-0008 §2 as the example of a resource with no HTTP analogue
